services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:${FREELIB_PORT:-8099}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - cerdaslab_ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - freelib_postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8

networks:
  cerdaslab_ai:
    external: true
    name: ${CERDASLAB_DOCKER_NETWORK:?set CERDASLAB_DOCKER_NETWORK}

volumes:
  freelib_postgres_data:
