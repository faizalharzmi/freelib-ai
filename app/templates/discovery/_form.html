<form class="search-form" action="{% url 'search' %}" method="get" data-search-form><label for="id_q">Describe your next
        read</label>
    <div class="search-row">{{ form.q }}<button type="submit" class="btn-primary">Find books <span
                aria-hidden="true">→</span></button></div>{% if form.q.errors %}<p class="form-error" role="alert">{{
        form.q.errors|join:', ' }}</p>{% endif %}<p class="form-help">Try a topic, reading level, language, or the kind
        of book you need.</p>
</form>
